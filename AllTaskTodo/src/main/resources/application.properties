spring.application.name=AllTaskTodo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alltask_db?createDatabaseIfNotExist=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Frontend origin
# Render example:
# APP_CORS_ALLOWED_ORIGINS=https://your-frontend.onrender.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SQL initialization
# local default: always
# production recommended: never
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

mybatis.configuration.map-underscore-to-camel-case=true
