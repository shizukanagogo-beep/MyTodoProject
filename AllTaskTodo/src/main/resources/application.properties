spring.application.name=AllTaskTodo

# MySQLへの接続設定
# spring.datasource.url=jdbc:mysql://db:3306/alltask_db?createDatabaseIfNotExist=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alltask_db?createDatabaseIfNotExist=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 初期化設定（初回起動時にテーブルを作成する場合）
spring.sql.init.mode=never
mybatis.configuration.map-underscore-to-camel-case=true